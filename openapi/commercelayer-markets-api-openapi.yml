openapi: 3.0.1
info:
  title: Commerce Layer Core Addresses Markets API
  description: Commerce Layer is a headless, composable commerce platform. The Core API is 100% compliant with the JSON:API specification (v1.0) and supports compound documents, sparse fieldsets, resource linking, filtering, sorting, and pagination. All requests are authenticated with an OAuth2 Bearer access token obtained from https://auth.commercelayer.io/oauth/token, and access tokens may be scoped to a market or stock location. Resources are served under the organization subdomain at https://{organization}.commercelayer.io/api using the application/vnd.api+json content type.
  termsOfService: https://commercelayer.io/legal/terms-of-service
  contact:
    name: Commerce Layer Support
    url: https://commercelayer.io/contact
  version: '4.0'
servers:
- url: https://{organization}.commercelayer.io/api
  description: Organization-scoped Core API endpoint
  variables:
    organization:
      default: yourdomain
      description: Your Commerce Layer organization subdomain (slug).
security:
- bearerAuth: []
tags:
- name: Markets
  description: Markets binding price list, inventory model, and merchant.
paths:
  /markets:
    get:
      operationId: listMarkets
      tags:
      - Markets
      summary: List all markets
      responses:
        '200':
          description: A list of market resources.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ResourceList'
    post:
      operationId: createMarket
      tags:
      - Markets
      summary: Create a market
      responses:
        '201':
          description: The created market resource.
  /markets/{marketId}:
    parameters:
    - $ref: '#/components/parameters/ResourceId'
    get:
      operationId: getMarket
      tags:
      - Markets
      summary: Retrieve a market
      responses:
        '200':
          description: The requested market resource.
    patch:
      operationId: updateMarket
      tags:
      - Markets
      summary: Update a market
      responses:
        '200':
          description: The updated market resource.
    delete:
      operationId: deleteMarket
      tags:
      - Markets
      summary: Delete a market
      responses:
        '204':
          description: The market was deleted.
components:
  schemas:
    ResourceList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
        meta:
          $ref: '#/components/schemas/Meta'
        links:
          type: object
    Resource:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        attributes:
          type: object
        relationships:
          type: object
        links:
          type: object
    Meta:
      type: object
      properties:
        record_count:
          type: integer
        page_count:
          type: integer
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: The resource unique identifier.
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'OAuth2 access token obtained from https://auth.commercelayer.io/oauth/token (client_credentials, password, authorization_code, refresh_token, or JWT bearer grant). Passed as Authorization: Bearer {access_token}. Tokens may carry a market or stock_location scope.'

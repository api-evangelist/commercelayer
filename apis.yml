aid: commercelayer
url: https://raw.githubusercontent.com/api-evangelist/commercelayer/refs/heads/main/apis.yml
name: Commerce Layer
kind: company
description: Commerce Layer is a headless, composable commerce platform that exposes
  a JSON:API-compliant REST API for building omnichannel storefronts and order
  management. The Core API serves SKUs, prices, stock, orders, line items, customers,
  addresses, shipments, payment methods, markets, and promotions, with OAuth2
  authentication, market-scoped access tokens, and real-time webhooks.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Commerce
- Headless
- Composable
- eCommerce
- JSON:API
- Orders
created: '2026-06-21'
modified: '2026-06-21'
specificationVersion: '0.19'

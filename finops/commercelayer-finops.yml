meters:
- name: live_orders
  description: Live orders placed per month; the Developer plan includes 100 free live orders/month.
  unit: orders
  aggregation: sum
  dimensions:
  - organization
  - market
- name: skus
  description: Number of SKUs in the catalog, capped on the Developer plan (1,000) and unlimited on Enterprise.
  unit: skus
  aggregation: max
  dimensions:
  - organization
- name: markets
  description: Number of active markets, capped on the Developer plan (2) and unlimited on Enterprise.
  unit: markets
  aggregation: max
  dimensions:
  - organization
- name: users
  description: Number of seats/users on the organization.
  unit: users
  aggregation: max
  dimensions:
  - organization
- name: add_on_services
  description: Optional add-ons (distributed OMS, promotion engine, metrics dashboard) billed separately.
  unit: services
  aggregation: sum
  dimensions:
  - organization
  - service
principles:
- name: Visibility
  description: Track live order volume against the plan allowance and monitor SKU, market, and user counts approaching plan caps.
- name: Allocation
  description: Map markets and organizations to business units, brands, or regions for cost attribution.
- name: Optimization
  description: Use test orders (free, unlimited) for development; only add paid add-ons when the business case is clear; right-size the plan to actual order volume.
- name: Accountability
  description: Assign owners per organization/market and review order volume and plan utilization against budget.

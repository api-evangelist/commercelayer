description: >-
  FinOps view of Commerce Layer spend. Commerce Layer offers a free Developer
  plan (capped organizations, users, markets, SKUs, links, and 100 live orders
  per month) and a custom-priced Enterprise plan. The primary cost drivers are
  live order volume and plan tier, plus optional add-on services (distributed
  OMS, promotion engine, metrics dashboard). Payment gateway / PSP fees are
  billed by the payment providers, not by Commerce Layer.
notes: >-
  Commerce Layer does not publish per-order or intermediate-tier pricing;
  Enterprise pricing and add-on costs are negotiated. Verify the billing model
  against the pricing page during reconciliation.
sources:
- https://commercelayer.io/pricing
